name: Run Now

on:
  push:
    paths:
      - 'data/inputs/run_trigger.txt'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt

      - name: Run orchestrator
        env:
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_PASS:          ${{ secrets.GMAIL_PASS }}
          UPSTOX_TOKEN:        ${{ secrets.UPSTOX_TOKEN }}
          UPSTOX_TOKEN_EXPIRY: ${{ secrets.UPSTOX_TOKEN_EXPIRY }}
        run: python orchestrator/main.py --sip 50000

      - name: Commit outputs
        run: |
          git config user.name "SIP Bot"
          git config user.email "bot@local"
          git add data/outputs/ data/inputs/
          git diff --staged --quiet || git commit -m "SIP Plan $(date +'%Y-%m-%d %H:%M')"
          git push
