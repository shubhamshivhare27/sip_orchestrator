name: Monthly SIP Orchestration Run

on:
  schedule:
    - cron: "30 9 1 * *"   # 1st of month, 3:00 PM IST (9:30 UTC)
                             # Engine 3 emails arrive Mon 11AM-1PM IST — safe gap
  workflow_dispatch:
    inputs:
      sip_amount:
        description: "SIP amount in Rs (overrides saved value)"
        required: false
        default: ""
      dry_run:
        description: "true = cached data only"
        required: false
        default: "false"
        type: choice
        options: ["false","true"]

permissions:
  contents: write

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: "pip"}
      - run: pip install -r requirements.txt

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: sip-cache-${{ github.run_id }}
          restore-keys: sip-cache-

      - name: Run orchestrator
        env:
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_PASS:          ${{ secrets.GMAIL_PASS }}
          UPSTOX_TOKEN:        ${{ secrets.UPSTOX_TOKEN }}
          UPSTOX_TOKEN_EXPIRY: ${{ secrets.UPSTOX_TOKEN_EXPIRY }}
        run: |
          DRY=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && DRY="--dry-run"
          SIP="${{ github.event.inputs.sip_amount }}"
          if [ -n "$SIP" ]; then
            python orchestrator/main.py --sip $SIP $DRY
          else
            python orchestrator/main.py $DRY
          fi

      - name: Commit execution plan
        run: |
          git config user.name  "SIP Orchestrator Bot"
          git config user.email "bot@sip-orchestrator.local"
          git add data/outputs/ data/inputs/
          git diff --staged --quiet || git commit -m "SIP Plan $(date +'%Y-%m-%d')"
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sip-plan-${{ github.run_id }}
          path: data/outputs/latest_execution_plan.json
          retention-days: 90

      - name: Save cache
        if: always()
        uses: actions/cache@v4
        with:
          path: data/cache
          key: sip-cache-${{ github.run_id }}
